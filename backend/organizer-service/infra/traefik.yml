# Traefik: reverse proxy + load balancer placed in front of all FindOpp services.
# Routes are not written here: Traefik reads them from Consul (tags "traefik.*"
# added by `python manage.py register_consul` in each service).
entryPoints:
  web:
    address: ":80"

api:
  dashboard: true
  insecure: true          # dashboard on :8080 (demo only)

providers:
  consulCatalog:
    exposedByDefault: false
    refreshInterval: 5s
    endpoint:
      address: "consul:8500"   # multi-server: replaced by CONSUL_ADDRESS (see deploy/)

log:
  level: INFO
accessLog: {}

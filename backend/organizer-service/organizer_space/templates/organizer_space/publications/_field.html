{# One labelled field with its errors: {% include "organizer_space/publications/_field.html" with field=form.title %} #}
<div class="field {% if field.errors %}has-error{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% if field.help_text %}<small class="muted">{{ field.help_text }}</small>{% endif %}
  {% for error in field.errors %}<small class="field__error">{{ error }}</small>{% endfor %}
</div>
